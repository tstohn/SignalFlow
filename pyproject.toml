[project]
name = "vcc-download"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.10",
    "cell-eval2>=0.16.0",
    "gcsfs>=2024.2.0",
    "h5py>=3.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "tensorboard>=2.21.0",
    "torch>=2.7.1,<2.8",
    "vcc-cli>=0.2.1",
]

# Driver 525 supports CUDA 12.0 at most and recent torch cu12x builds fail on it
# ("device busy or unavailable"), so take torch from the CUDA 11.8 index.
[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
